name: Build frontend Docker image

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'Dockerfile'
      - '.github/workflows/frontend-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/layalireal/layalireal-frontend:latest
            ghcr.io/layalireal/layalireal-frontend:${{ github.sha }}

      - name: Try to set GHCR package public (EasyPanel pull without login)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for pkg in layalireal-frontend layalireal/layalireal-frontend; do
            gh api --method PATCH "/orgs/layalireal/packages/container/${pkg}" -f visibility=public && exit 0
            gh api --method PATCH "/users/layalireal/packages/container/${pkg}" -f visibility=public && exit 0
          done
          echo "::warning::Could not set package public automatically. Make it public manually: GitHub → Packages → layalireal-frontend → Package settings → Public"
